<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="mckNavyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051C2C"/>
      <stop offset="50%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mckCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00A3E0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="250" rx="16" fill="url(#mckNavyBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="0" y="0" width="400" height="6" fill="url(#mckCyan)" rx="3"/>

  <!-- McKinsey & Company Forward Icon Emblem -->
  <g transform="translate(32, 36)">
    <rect width="52" height="52" rx="12" fill="rgba(0,163,224,0.12)" stroke="rgba(0,163,224,0.4)" stroke-width="1.5"/>
    <!-- Forward Chevrons -->
    <path d="M18 16L28 26L18 36" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 16L36 26L26 36" fill="none" stroke="#00A3E0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Header Text -->
  <text x="96" y="56" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">MCKINSEY.ORG</text>
  <text x="96" y="78" fill="#F8FAFC" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.02em">Forward Program</text>

  <!-- Subtitle -->
  <text x="32" y="124" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400">Practical Business, Digital Acumen &amp; Problem-Solving Skills</text>

  <!-- Core Competency Tags -->
  <g transform="translate(32, 142)">
    <rect width="112" height="26" rx="6" fill="rgba(0,163,224,0.14)" stroke="rgba(0,163,224,0.35)" stroke-width="1"/>
    <text x="56" y="17" fill="#38BDF8" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Problem Solving</text>
  </g>
  <g transform="translate(152, 142)">
    <rect width="104" height="26" rx="6" fill="rgba(0,163,224,0.14)" stroke="rgba(0,163,224,0.35)" stroke-width="1"/>
    <text x="52" y="17" fill="#38BDF8" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Digital Mindset</text>
  </g>
  <g transform="translate(264, 142)">
    <rect width="96" height="26" rx="6" fill="rgba(0,163,224,0.14)" stroke="rgba(0,163,224,0.35)" stroke-width="1"/>
    <text x="48" y="17" fill="#38BDF8" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Adaptability</text>
  </g>

  <!-- Divider Line -->
  <line x1="32" y1="192" x2="368" y2="192" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Footer status -->
  <circle cx="40" cy="216" r="4.5" fill="#10B981"/>
  <text x="52" y="220" fill="#10B981" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600">Completed Program</text>
  <text x="368" y="220" fill="#64748B" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="500" text-anchor="end">Year 2026</text>
</svg>